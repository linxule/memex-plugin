name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --all-extras
      - run: uv run --frozen pytest -q
      - run: uv build
      - run: uv run --frozen python scripts/check_distribution.py
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          python-version: "3.13"
      - name: Audit locked runtime and development dependencies
        run: |
          uv export --locked --all-extras --all-groups --no-emit-project --format requirements-txt --output-file /tmp/dependencies.txt
          uvx pip-audit==2.10.1 --disable-pip --no-deps --require-hashes -r /tmp/dependencies.txt
