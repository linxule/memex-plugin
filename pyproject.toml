[project]
name = "memex-plugin"
version = "0.20.1"
description = "Collaborative memory CLI for human-AI work: local vaults, memos, and hybrid search"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Xule Lin" }]
keywords = ["memory", "knowledge-base", "obsidian", "cli", "agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Indexing",
]
requires-python = ">=3.11"
dependencies = [
    "filelock>=3.0",
    "tiktoken>=0.5",
    "google-genai>=2.0.0",
    "sqlite-vec>=0.1.8",
    "requests>=2.31.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.13.0",
    "typer>=0.9.0",
    "pyyaml>=6.0",
]

[project.scripts]
memex = "memex.cli:main"

[project.urls]
Homepage = "https://github.com/linxule/memex-plugin"
Repository = "https://github.com/linxule/memex-plugin"
Issues = "https://github.com/linxule/memex-plugin/issues"
Changelog = "https://github.com/linxule/memex-plugin/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "ruff",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memex"]

[tool.hatch.build.targets.sdist]
include = ["/src/memex", "/pyproject.toml", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[tool.uv]
package = true

[tool.ruff]
target-version = "py311"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff",
]
