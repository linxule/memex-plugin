[project]
name = "memex"
version = "0.14.2"
requires-python = ">=3.11"
dependencies = [
    "filelock>=3.0",
    "tiktoken>=0.5",
    "google-genai>=1.0.0",
    "sqlite-vec>=0.1.6",
    "requests>=2.31.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "typer>=0.9.0",
]

[project.scripts]
memex = "memex.cli:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memex"]

[tool.uv]
package = true

[tool.ruff]
target-version = "py311"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
